<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 26-1人工智能徐聪颖的作业</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #fbe9e7 0%, #f5d6c6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            padding: 16px;
        }

        .app-card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 250, 240, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.25),
                        0 0 0 2px #fff8ee inset,
                        0 0 0 4px #e6c9b8 inset;
            padding: 28px 30px 34px;
            transition: all 0.2s ease;
            border: 1px solid #edcbb5;
        }

        h1 {
            font-size: 2.2rem;
            color: #5e3e2c;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            font-weight: 700;
            text-shadow: 2px 2px 0 #f0dac8;
        }

        h1 span {
            font-size: 2rem;
            transform: rotate(8deg);
            display: inline-block;
        }

        .subhead {
            color: #8b6b58;
            font-size: 1rem;
            margin-bottom: 24px;
            margin-left: 8px;
            border-left: 4px solid #d9b8a4;
            padding-left: 14px;
            font-style: italic;
            font-weight: 400;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 24px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-weight: 600;
            color: #694e3c;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 4px;
        }

        .field label i {
            font-style: normal;
            font-size: 1.2rem;
        }

        .field input, .field textarea {
            background: #fffcf7;
            border: 2px solid #e7cfbe;
            border-radius: 24px;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-family: inherit;
            color: #3a2b22;
            outline: none;
            transition: all 0.2s;
            resize: vertical;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
        }

        .field input:focus, .field textarea:focus {
            border-color: #c49a7b;
            background: #ffffff;
            box-shadow: 0 0 0 5px rgba(196, 154, 123, 0.15);
        }

        .field textarea {
            min-height: 100px;
            line-height: 1.5;
        }

        .row-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .btn {
            background: #fff1e6;
            border: 2px solid #dbbca8;
            border-radius: 40px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            color: #543b2c;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1 0 auto;
            box-shadow: 0 4px 0 #c9aa95;
            transform: translateY(0);
            letter-spacing: 0.3px;
        }

        .btn:hover {
            background: #ffe8d9;
            border-color: #c9a68e;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b28f78;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b28f78;
        }

        .btn-primary {
            background: #f7d9c7;
            border-color: #b28b72;
            color: #3f2b1f;
            box-shadow: 0 4px 0 #9e7a62;
        }

        .btn-primary:hover {
            background: #f3cdb6;
        }

        .btn-secondary {
            background: #efe2d8;
            border-color: #cbb5a6;
            box-shadow: 0 4px 0 #b8a08f;
        }

        .btn-secondary:hover {
            background: #e6d5c9;
        }

        .diary-output {
            background: #faf1e9;
            border-radius: 32px;
            padding: 22px 26px;
            margin-top: 18px;
            border: 2px dashed #cdb1a0;
            box-shadow: inset 0 0 0 2px #fffcf8, 0 10px 20px -10px rgba(90, 60, 40, 0.2);
        }

        .diary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #8c6f5d;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 12px;
            border-bottom: 2px solid #e2cdbe;
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .diary-content {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #3f2e24;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
            min-height: 160px;
        }

        .diary-content .placeholder {
            color: #ab8e7a;
            font-style: italic;
        }

        .pet-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .footer-note {
            font-size: 0.8rem;
            color: #b29886;
            text-align: center;
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .badge {
            background: #dcc9bb;
            border-radius: 50px;
            padding: 4px 10px;
            color: #4b372b;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .missing-hint {
            background: #fff2e6;
            border-left: 6px solid #e6a882;
            padding: 12px 18px;
            border-radius: 18px;
            margin-bottom: 16px;
            color: #6f4e39;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.03);
        }

        .missing-hint span {
            font-size: 1.3rem;
        }

        /* 滚动条美化 */
        textarea::-webkit-scrollbar {
            width: 10px;
        }

        textarea::-webkit-scrollbar-track {
            background: #f7ebe2;
            border-radius: 12px;
        }

        textarea::-webkit-scrollbar-thumb {
            background: #d3b6a4;
            border-radius: 12px;
            border: 2px solid #f7ebe2;
        }
    </style>
</head>
<body>

<div class="app-card" id="app">
    <h1>
        <span>🐕</span> 宠物日记
    </h1>
    <div class="subhead">用宠物的口吻，记录每一天的小确幸</div>

    <!-- 输入区 -->
    <div class="input-area">
        <div class="field">
            <label><i>📅</i> 日期</label>
            <input type="date" id="dateInput" value="2025-04-01">
        </div>

        <div class="field">
            <label><i>📝</i> 发生了什么？(真实事件)</label>
            <textarea id="eventInput" placeholder="例如：今天主人带我去公园，我追了一只蝴蝶，还吃了牛肉干……"></textarea>
        </div>

        <div class="field">
            <label><i>🔍</i> 补充你记得的真实细节 (可留空)</label>
            <textarea id="detailsInput" placeholder="例如：蝴蝶是黄色的，主人穿了蓝色外套，我跑得太快摔了一跤……"></textarea>
        </div>
    </div>

    <!-- 按钮区 -->
    <div class="row-buttons">
        <button class="btn btn-primary" id="generateBtn">✨ 生成宠物日记</button>
        <button class="btn btn-secondary" id="askBtn">❓ 缺少事实？先询问</button>
        <button class="btn btn-secondary" id="clearBtn">🧹 清空</button>
    </div>

    <!-- 提示区域 (缺少事实提示) -->
    <div id="missingHintContainer"></div>

    <!-- 日记输出区 -->
    <div class="diary-output">
        <div class="diary-header">
            <span>📖 宠物的日记</span>
            <span class="pet-icon" id="petEmoji">🐾</span>
        </div>
        <div class="diary-content" id="diaryContent">
            <span class="placeholder">点击「生成宠物日记」，用宠物的口吻记录今天吧~</span>
        </div>
    </div>

    <div class="footer-note">
        <span class="badge">🐱 喵星人 & 🐶 汪星人 通用</span>
        <span class="badge">✨ 事实优先 · 缺细节会询问</span>
    </div>
</div>

<script>
    (function() {
        // DOM 元素
        const dateInput = document.getElementById('dateInput');
        const eventInput = document.getElementById('eventInput');
        const detailsInput = document.getElementById('detailsInput');
        const generateBtn = document.getElementById('generateBtn');
        const askBtn = document.getElementById('askBtn');
        const clearBtn = document.getElementById('clearBtn');
        const diaryContent = document.getElementById('diaryContent');
        const missingHintContainer = document.getElementById('missingHintContainer');
        const petEmoji = document.getElementById('petEmoji');

        // 工具函数：格式化日期为中文年月日
        function formatChineseDate(dateStr) {
            if (!dateStr) return '今天';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            const year = d.getFullYear();
            const month = d.getMonth() + 1;
            const day = d.getDate();
            return `${year}年${month}月${day}日`;
        }

        // 获取当前日期字符串 (用于默认)
        function getTodayStr() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // 设置默认日期
        dateInput.value = getTodayStr();

        // 随机宠物表情 (增加趣味)
        function randomPetEmoji() {
            const emojis = ['🐶', '🐱', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐸'];
            return emojis[Math.floor(Math.random() * emojis.length)];
        }

        // 生成口吻词库 (让日记更生动)
        const petPhrases = {
            openings: [
                '今天可真是特别的一天，', '汪/喵～ 让我想想，', '呼噜呼噜～ ', '嗨！我的两脚兽朋友，', 
                '本宠物今天可开心啦！', '今天太阳晒得我肚皮暖暖的，', '咳咳，重要日记！', 
                '你绝对猜不到今天发生了什么——', '今天又是被宠爱的一天，'
            ],
            connectors: [
                '然后呢，', '接着呀，', '后来呢，', '而且哦，', '最棒的是，', '还有还有，', 
                '你猜怎么着，', '偷偷告诉你，', '对了对了，'
            ],
            endings: [
                '真是美好的一天～ 希望明天也一样！', '本宝宝要睡觉了，晚安咯～', 
                '主人，明天还要这样陪我玩哦！', '今天的故事就到这里啦，喵/汪！', 
                '我会把这些都记在小本本上的！', '尾巴摇摇，开心到飞起～', 
                '就这样，一个完美的日子！', '要是每天都能这样就好了呢～'
            ]
        };

        // 从数组中随机取一个
        function randomPick(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // 主逻辑：生成宠物日记 (如果缺少关键事实，会提示并返回null)
        function buildPetDiary() {
            const dateVal = dateInput.value.trim();
            const eventVal = eventInput.value.trim();
            const detailsVal = detailsInput.value.trim();

            // 清除之前的提示
            missingHintContainer.innerHTML = '';

            // 事实检查：必须填写“发生了什么”
            if (!eventVal) {
                missingHintContainer.innerHTML = `
                    <div class="missing-hint">
                        <span>🐾</span> 咦？还没写今天发生了什么～ 用宠物口吻也要基于事实呀！请先填写「发生了什么」。
                    </div>`;
                // 日记区域显示提示，而不是生成
                diaryContent.innerHTML = `<span class="placeholder">等待你告诉宠物今天发生了什么…… 填写事件后就能生成日记啦。</span>`;
                return null;
            }

            // 日期处理 (虽然日期可空，但给默认值)
            const dateStr = dateVal ? formatChineseDate(dateVal) : '今天';

            // 真实细节处理：如果没填细节，标记为“未提供”，但在生成时留空或者用【需要补充】提示
            // 但我们也要检查：缺少事实时先询问或者留空。这里设计：如果细节为空，我们保留一个占位提示，并且不编造。
            // 同时，用户如果点击“缺少事实？先询问”，会给出具体询问哪些细节。
            
            // 构建日记核心内容：基于事件，但加入宠物口吻，并且不编造未提供的细节。
            // 细节为空时，在日记里用【……】或直接省略，但工具会提示询问。
            const hasDetails = detailsVal.length > 0;

            // 随机选择口吻元素
            const opening = randomPick(petPhrases.openings);
            const connector = randomPick(petPhrases.connectors);
            const ending = randomPick(petPhrases.endings);
            const petEmojiChar = randomPetEmoji();

            // 把事件转换为第一人称宠物口吻
            // 简单处理：把“我”相关的内容保留，但以宠物的角度叙述。为了更自然，我们可以用宠物视角描述事件
            // 比如用户输入“主人带我去公园”，宠物口吻可以是“主人带我去了公园，我超级兴奋！”
            // 但为了保留真实细节，我们直接引用事件，并加入宠物情感词。
            
            let eventNarrative = eventVal;
            // 如果事件中已经有“我”，很好；如果没有，可以适当加“我” （但不要改变事实）
            // 但不要过度篡改，所以我们可以选择在事件前后加宠物的感受，但保证事实不歪曲。
            // 此外，细节部分如果有，就自然地融入。
            
            // 构建细节部分：如果提供了细节，就附加在事件描述后面
            let detailsPart = '';
            if (hasDetails) {
                // 把细节也融入，可以用“我记得……”等
                detailsPart = ` 我还记得一些细节：${detailsVal}。`;
            } else {
                // 留空，但是不编造，也可以给一个委婉的留白
                detailsPart = ''; // 或者一个提示： (有些细节我记不清啦……)
                // 但是为了更好地体现“缺少事实时留空”，我们可以在日记里表示有些记不清，但不会捏造。
                // 所以可加一句“有些细节我记不太清了，但……”。
                // 但这不是必须，也可以完全不加。
                // 为了友好，我们可以加一个括号说明细节未提供，但这是宠物口吻？可以加“唔…细节有点模糊”
                // 但为了避免误导，我们可以在日记里以宠物的口吻说明“有些事记不清了”，但不要编造。
                // 我们选择：在细节缺失时，加一句“（不过有些小细节我记不太清了……）”这样不算编造事实，只是说明记忆模糊。
                // 这样更符合宠物口吻。
                detailsPart = ` （有些小细节我记不太清了……）`;
            }

            // 组合日记内容：用宠物语气 + 事件描述 + 细节 + 结尾
            // 但必须保证事件的真实性，所以我们会保留原始事件描述的关键信息，但转换叙述角度。
            // 简单方法：用宠物第一人称复述事件，但不改变事实。
            // 例如：事件 = "今天主人带我去公园，我追了一只蝴蝶"
            // 日记中：“今天主人带我去公园啦！我追了一只蝴蝶，好开心～”
            // 我们可以做一些轻量的口吻转换：把“我”保留，把“主人”换成“我的两脚兽”之类的。
            // 但不能改变事实，所以只能替换称呼。为了通用，我们尽量保留原意，但添加宠物情绪词。

            // 开始构建事件叙述，使用宠物的视角：
            let eventInPetVoice = eventVal;
            // 替换一些称呼，增加宠物感 (但保留原始含义)
            const replacements = [
                { pattern: /主人/g, replacement: '我的两脚兽' },
                { pattern: /我/g, replacement: '本宝宝' }, // 但如果本身是“我”会变“本宝宝”，可以但稍微修改
                // 不过可能会重复，比如“本宝宝”太频繁。我们选择性替换一部分。
                // 简单起见，我们只替换“主人”为“铲屎官/两脚兽”，保留“我”因为宠物也会说“我”
            ];
            // 更温和的替换：仅将“主人”替换为“铲屎官”，保留“我”
            eventInPetVoice = eventVal.replace(/主人/g, '铲屎官');
            // 再把“我”保留，但可以加一些语气词
            // 在事件前后加口吻词
            // 但也要小心不要破坏原意

            // 更好的方法：先陈述事实，再以宠物口吻评论
            // 但为了日记的连贯，可以这样：
            // 开头 + 事件(以宠物视角叙述) + 细节 + 结尾

            // 但为了更符合“按设定口吻生成日记”，我们让语言更俏皮：
            // 可以加一些拟声词和宠物行为描述（但不要编造事件，只加感受）
            // 例如：开心地摇尾巴，呼噜呼噜等等。

            // 但编造感受是允许的，因为这是宠物口吻，感受不是事实细节。但也要适度。
            // 事实部分严格根据用户输入。

            // 所以最终日记结构：
            // [日期] 开头语 + 事件(宠物视角改写) + 细节(如果提供) + 宠物感受评论 + 结尾

            // 构建感受（基于事件，但不虚构具体情节）
            const feelings = [
                '开心得转圈圈！', '尾巴都要摇断啦～', '舒服得呼噜呼噜叫。', 
                '眼睛亮晶晶的！', '心里美滋滋的。', '超满足的！'
            ];
            const randomFeeling = randomPick(feelings);

            // 构建最终日记文本
            let diaryText = `${dateStr}  ${opening}${eventInPetVoice}。${detailsPart} ${randomFeeling} ${connector}${ending}`;

            // 如果细节为空，我们在日记最后可以再加一个友好的提示，但已经是宠物口吻了，可以省略。
            // 此外清理多余空格和标点
            diaryText = diaryText.replace(/\s+/g, ' ').replace(/。\./g, '。').replace(/，\,/g, '，');

            // 确保句号等正确
            // 在diary输出前，我们也可以将宠物表情放在末尾？不需要，已有表情。
            return diaryText;
        }

        // 更新日记显示
        function updateDiary() {
            const diary = buildPetDiary();
            if (diary) {
                diaryContent.textContent = diary;
                // 随机改变宠物emoji
                petEmoji.textContent = randomPetEmoji();
            }
            // 如果diary为null，buildPetDiary已经设置了diaryContent的提示，并且missingHint显示
        }

        // 生成按钮点击
        generateBtn.addEventListener('click', function() {
            updateDiary();
        });

        // 询问按钮：检查缺少哪些事实细节，给用户提示
        askBtn.addEventListener('click', function() {
            const eventVal = eventInput.value.trim();
            const detailsVal = detailsInput.value.trim();
            const dateVal = dateInput.value.trim();

            let missingMessages = [];

            if (!eventVal) {
                missingMessages.push('📌 还没有填写「发生了什么」——这是日记的核心事实哦！');
            }

            if (!detailsVal && eventVal) {
                missingMessages.push('🔍 细节部分为空。你可以补充一些真实细节，比如：当时的天气、周围的环境、具体的动作、吃了什么、遇到了谁……这样日记会更生动！');
            }

            if (!dateVal) {
                missingMessages.push('📅 日期没有填写，日记会默认使用“今天”。');
            }

            // 如果事件为空，就不继续询问细节了，先让填事件
            if (!eventVal) {
                missingHintContainer.innerHTML = `
                    <div class="missing-hint">
                        <span>🐾</span> ${missingMessages.join(' ')}
                    </div>`;
                diaryContent.innerHTML = `<span class="placeholder">填写事件后，我才能帮你写日记哦～</span>`;
                return;
            }

            // 如果事件有，但细节为空，提示询问细节
            if (missingMessages.length > 0) {
                missingHintContainer.innerHTML = `
                    <div class="missing-hint">
                        <span>❓</span> ${missingMessages.join(' ')}
                    </div>`;
            } else {
                // 如果都填了
                missingHintContainer.innerHTML = `
                    <div class="missing-hint" style="border-left-color: #a8c3a0; background: #eaf3e8;">
                        <span>✅</span> 事实和细节都很完整啦！可以直接生成日记咯～
                    </div>`;
            }

            // 注意：不清空日记内容，让用户自己决定。但这里我们不自动生成，只是询问。
            // 如果用户想要生成，需要点生成按钮。
            // 但为了用户体验，可以提示。
        });

        // 清空按钮：清空所有输入和输出，重置为初始状态
        clearBtn.addEventListener('click', function() {
            // 清空输入
            dateInput.value = getTodayStr();
            eventInput.value = '';
            detailsInput.value = '';
            // 清空提示
            missingHintContainer.innerHTML = '';
            // 重置日记内容
            diaryContent.innerHTML = `<span class="placeholder">点击「生成宠物日记」，用宠物的口吻记录今天吧~</span>`;
            // 重置宠物emoji
            petEmoji.textContent = '🐾';
        });

        // 额外优化：如果用户事件为空时点击生成，我们已经处理了；但点击询问也一样。
        // 当用户开始输入事件时，可以清除之前的错误提示 (但保留询问)
        eventInput.addEventListener('input', function() {
            // 如果之前有“没有填写事件”的提示，可以清除
            if (eventInput.value.trim().length > 0) {
                // 如果有缺失事件的提示，就清掉
                const hint = missingHintContainer.querySelector('.missing-hint');
                if (hint && hint.textContent.includes('还没有填写「发生了什么」')) {
                    missingHintContainer.innerHTML = '';
                }
            }
        });

        // 如果用户填写了细节，也清除部分提示（可选）
        detailsInput.addEventListener('input', function() {
            // 如果细节有了，但之前提示细节为空，就不显示细节提示了
            if (detailsInput.value.trim().length > 0) {
                const hint = missingHintContainer.querySelector('.missing-hint');
                if (hint && hint.textContent.includes('细节部分为空')) {
                    // 如果事件也填写了，则清除所有提示
                    if (eventInput.value.trim().length > 0) {
                        missingHintContainer.innerHTML = '';
                    } else {
                        // 只移除细节部分？简单处理：重新检查
                        // 这里略，为了简单，暂时不动。但可以重新触发一下askBtn的逻辑？不做了。
                        // 或者直接清除细节相关提示，保留事件提示。
                        // 简单实现：重建提示
                        const eventVal = eventInput.value.trim();
                        if (!eventVal) {
                            missingHintContainer.innerHTML = `
                                <div class="missing-hint">
                                    <span>🐾</span> 还没有填写「发生了什么」——这是日记的核心事实哦！
                                </div>`;
                        } else {
                            missingHintContainer.innerHTML = ''; // 清除所有
                        }
                    }
                }
            }
        });

        // 日期改变时，可以不做处理。但可以更友好
        dateInput.addEventListener('change', function() {
            // 如果日期为空，不处理
        });

        // 初始化时，如果事件为空，日记区域显示placeholder
        // 已经默认

        // 再加一点小趣味：页面加载后随机一个宠物表情在标题处？但已经有了
        // 还可以让生成时改变宠物表情
    })();
</script>

</html>
